<div class="d-flex">
  <nav class="sidebar p-3" style="width:220px">
    <h5 class="text-white mb-4">⚗ Pharmacist</h5>
    <a routerLink="/pharmacist">Dashboard</a>
    <a routerLink="/pharmacist/inventory">Inventory</a>
    <a routerLink="/pharmacist/reports">Reports</a>
    <hr class="border-secondary">
    <a href="#" (click)="api.logout()">Logout</a>
  </nav>
  <div class="flex-grow-1 p-4" style="background: linear-gradient(135deg, #e3f2fd 0%, #f5f7fa 100%);min-height:100vh">
    <h3 class="mb-3" style="color:#1565c0">⊞ Pharmacist Dashboard</h3>
    <div class="row g-3">
      <div class="col-md-3"><div class="card metric-card p-3 text-center" style="border-left:4px solid #0d6efd !important"><h4>{{metrics.total}}</h4><small>⊞ Total Medicines</small></div></div>
      <div class="col-md-3"><div class="card metric-card p-3 text-center" style="border-left:4px solid #f59e0b !important"><h4>{{metrics.lowStock}}</h4><small>▽ Low Stock</small></div></div>
      <div class="col-md-3"><div class="card metric-card p-3 text-center" style="border-left:4px solid #f97316 !important"><h4>{{metrics.expiringSoon}}</h4><small>⏱ Expiring Soon</small></div></div>
      <div class="col-md-3"><div class="card metric-card p-3 text-center" style="border-left:4px solid #ef4444 !important"><h4>{{metrics.expired}}</h4><small>✗ Expired</small></div></div>
    </div>
  </div>
</div>
