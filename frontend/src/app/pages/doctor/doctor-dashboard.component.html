<div class="admin-layout">
  <nav class="sidebar">
    <div class="sidebar-brand"><img src="assets/1000054328.webp" alt="Logo"><span>Ballogdajan Medical Clinic</span></div>
    <a routerLink="/doctor" class="active">⊞ Dashboard</a>
    <a routerLink="/doctor/appointments">📋 Appointments</a>
    <a routerLink="/doctor/patients">👥 Patients</a>
    
  </nav>
  <div class="admin-main"><header class="admin-header"><h4>Dashboard</h4><div class="admin-header-actions"><app-notif-bell></app-notif-bell><div class="user-info"><span>{{api.user?.username}}</span><button class="btn-logout-sm" (click)="api.logout()">Logout</button></div></div></header><div class="admin-content">
    
    <div class="row g-3">
      <div class="col-md-4"><div class="card shadow-sm border-0 metric-card p-4 mb-3 text-center" style="border-left:4px solid #f59e0b !important"><h4>{{metrics.forConfirmation}}</h4><small>⟐ For Confirmation</small></div></div>
      <div class="col-md-4"><div class="card shadow-sm border-0 metric-card p-4 mb-3 text-center" style="border-left:4px solid #0d6efd !important"><h4>{{metrics.todayAppts}}</h4><small>☷ Today's Appointments</small></div></div>
      <div class="col-md-4"><div class="card shadow-sm border-0 metric-card p-4 mb-3 text-center" style="border-left:4px solid #06b6d4 !important"><h4>{{metrics.totalPatients}}</h4><small>⊞ Total Patients</small></div></div>
    </div>

    <div class="row g-3 mt-4" style="align-items:stretch">
      <div class="col-12 col-md-6 d-flex">
        <div class="card shadow-sm border-0 p-4 w-100" style="min-width:0;overflow:hidden">
          <h5 class="mb-3">Appointments by Status</h5>
          <div style="max-width:250px;margin:auto">
            <canvas baseChart [datasets]="statusData" [labels]="statusLabels" [options]="statusOptions" [type]="'doughnut'"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 d-flex">
        <div class="card shadow-sm border-0 p-4 w-100" style="min-width:0;overflow:hidden">
          <h5 class="mb-3">This Week's Appointments</h5>
          <canvas baseChart [datasets]="weekData" [labels]="weekLabels" [options]="weekOptions" [type]="'bar'"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
