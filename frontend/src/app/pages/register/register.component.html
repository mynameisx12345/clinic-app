<div class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: linear-gradient(135deg, #e3f2fd 0%, #f5f7fa 100%)">
  <div class="card shadow-sm border-0 p-4" style="width:500px">
    <h3 class="text-center mb-3" style="color:#1565c0">Register Patient Account</h3>
    @if (error) { <div class="alert alert-danger">{{error}}</div> }

    <div class="p-3 mb-3 rounded" style="background:#e3f2fd;border:2px solid #1976d2">
      <p class="fw-semibold text-primary mb-2">📝 Just fill in these to complete your registration:</p>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Username</label><input class="form-control" [(ngModel)]="form.username" name="un"></div>
        <div class="col-6"><label class="form-label">Password</label><div class="input-group"><input class="form-control" [type]="showPw ? 'text' : 'password'" [(ngModel)]="form.password" name="pw"><button class="btn btn-outline-secondary" type="button" (click)="showPw=!showPw">{{showPw ? '🙈' : '👁'}}</button></div></div>
      </div>
    </div>

    <h6 class="text-muted mb-2">Personal Information</h6>
    <div class="row g-2">
      <div class="col-6 mb-2"><label class="form-label">First Name</label><input class="form-control" [(ngModel)]="form.first_name" name="fn"></div>
      <div class="col-6 mb-2"><label class="form-label">Last Name</label><input class="form-control" [(ngModel)]="form.last_name" name="ln"></div>
      <div class="col-6 mb-2"><label class="form-label">Middle Name</label><input class="form-control" [(ngModel)]="form.middle_name" name="mn"></div>
      <div class="col-6 mb-2"><label class="form-label">Birthday</label><input class="form-control" type="date" [(ngModel)]="form.birthday" name="bd" (change)="calcAge()"></div>
      <div class="col-6 mb-2"><label class="form-label">Age</label><input class="form-control" [value]="form.age ?? ''" readonly></div>
      <div class="col-6 mb-2"><label class="form-label">Gender</label><select class="form-select" [(ngModel)]="form.gender" name="g"><option value="Male">Male</option><option value="Female">Female</option></select></div>
      <div class="col-6 mb-2"><label class="form-label">Contact</label><input class="form-control" [(ngModel)]="form.contact_number" name="cn"></div>
      <div class="col-6 mb-2"><label class="form-label">Email</label><input class="form-control" [(ngModel)]="form.email" name="em"></div>
      <div class="col-6 mb-2"><label class="form-label">Civil Status</label><select class="form-select" [(ngModel)]="form.civil_status" name="cs"><option>Single</option><option>Married</option><option>Widow</option><option>Widower</option><option>Separated</option><option>Divorced</option></select></div>
      <div class="col-6 mb-2"><label class="form-label">Blood Type</label><input class="form-control" [(ngModel)]="form.blood_type" name="bt"></div>
      <div class="col-12 mb-2"><label class="form-label">Allergies</label><input class="form-control" [(ngModel)]="form.allergies" name="al"></div>
      <div class="col-12 mb-2"><label class="form-label">Address</label><input class="form-control" [(ngModel)]="form.address" name="addr"></div>
    </div>
    <button class="btn btn-primary w-100 mt-3" style="border-radius:50px" (click)="register()" [disabled]="!form.first_name || !form.last_name || !form.birthday || !form.gender || !form.civil_status || !form.contact_number || !form.blood_type || !form.allergies || !form.address || !form.username || !form.password">Register</button>
    <div class="text-center mt-2"><a routerLink="/login">Already have an account? Login</a></div>
  </div>
</div>
