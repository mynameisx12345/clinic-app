<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #e3f2fd 0%, #f5f7fa 100%);">
  <div class="card shadow-sm border-0 p-5" style="width:400px;border-radius:16px">
    <div class="text-center mb-4">
      <span style="font-size:3rem">🏥</span>
      <h3 class="fw-bold mt-2" style="color:#1565c0">Welcome Back</h3>
      <p class="text-muted small">Sign in to your account</p>
    </div>
    @if (error) { <div class="alert alert-danger">{{error}}</div> }
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control form-control-lg" [(ngModel)]="username" name="u" placeholder="Enter username">
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input class="form-control form-control-lg" [type]="showPw ? 'text' : 'password'" [(ngModel)]="password" name="p" (keyup.enter)="login()" placeholder="Enter password">
        <button class="btn btn-outline-secondary" type="button" (click)="showPw=!showPw">{{showPw ? '🙈' : '👁'}}</button>
      </div>
    </div>
    <button class="btn btn-primary btn-lg w-100 shadow-sm" style="border-radius:50px" (click)="login()" [disabled]="loading || !username || !password">{{loading ? 'Logging in...' : 'Login'}}</button>
    <div class="text-center mt-4">
      <a routerLink="/" class="text-muted text-decoration-none">← Back to Home</a>
    </div>
  </div>
</div>
