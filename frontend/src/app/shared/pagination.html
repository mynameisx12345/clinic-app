<div class="d-flex flex-wrap justify-content-between align-items-center mt-3">
  <div class="d-flex align-items-center gap-2">
    <small class="text-muted">Rows per page:</small>
    <select class="form-select form-select-sm" style="width:auto" [ngModel]="pageSize" (ngModelChange)="pageSize=$event;page=1" name="ps">
      <option [value]="10">10</option>
      <option [value]="20">20</option>
      <option [value]="50">50</option>
      <option [value]="100">100</option>
    </select>
  </div>
  <div class="d-flex align-items-center gap-2">
    <small class="text-muted">{{(page-1)*pageSize+1}}–{{page*pageSize > totalItems ? totalItems : page*pageSize}} of {{totalItems}}</small>
    <button class="btn btn-sm btn-outline-secondary" [disabled]="page===1" (click)="page=page-1">‹</button>
    <button class="btn btn-sm btn-outline-secondary" [disabled]="page*pageSize>=totalItems" (click)="page=page+1">›</button>
  </div>
</div>
