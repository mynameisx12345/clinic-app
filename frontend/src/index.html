<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clinic App</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <script>
    document.addEventListener('click', function(e) {
      if (window.innerWidth > 768) return;
      var h5 = e.target.closest('.sidebar > h5');
      if (h5) { h5.parentElement.classList.toggle('menu-open'); return; }
      var link = e.target.closest('.sidebar a');
      if (link) { link.closest('.sidebar').classList.remove('menu-open'); }
    });
  </script>
</body>
</html>
